<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <radialGradient id="nebula" cx="54" cy="54" r="33" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4CC9F0" stop-opacity="0.33"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="50" cy="50" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9BE3FF"/>
      <stop offset="50%" stop-color="#3A7DFF"/>
      <stop offset="100%" stop-color="#14217A"/>
    </radialGradient>
  </defs>

  <rect width="108" height="108" fill="#020204"/>

  <!-- Nebula glow -->
  <circle cx="54" cy="54" r="33" fill="url(#nebula)"/>

  <!-- Outer cyan arc (matched orientation) -->
  <g transform="rotate(380 54 54)">
    <circle cx="54" cy="54" r="31" fill="none" stroke="#4CC9F0" stroke-width="2" stroke-linecap="round" stroke-dasharray="155.8 194.8"/>
  </g>

  <!-- Middle magenta arc (matched orientation) -->
  <g transform="rotate(240 54 54)">
    <circle cx="54" cy="54" r="22" fill="none" stroke="#F72585" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="96.7 138.3"/>
  </g>

  <!-- Inner faint ring -->
  <circle cx="54" cy="54" r="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.8"/>

  <!-- Tilted gold orbit -->
  <g transform="rotate(-28 54 54)">
    <ellipse cx="54" cy="54" rx="31" ry="11" fill="none" stroke="#FFD166" stroke-opacity="0.9" stroke-width="1.8"/>
  </g>

  <!-- Planet with 3D shading -->
  <circle cx="54" cy="54" r="9" fill="url(#planet)"/>

  <!-- Planet highlight -->
  <circle cx="50.5" cy="50.5" r="1.6" fill="#FFFFFF" fill-opacity="0.85"/>

  <!-- Satellites on orbits -->
  <circle cx="77" cy="34.7" r="2.4" fill="#FFD166"/>
  <circle cx="35" cy="65" r="1.8" fill="#FFFFFF"/>

  <!-- Four-point sparkles -->
  <path d="M36,34 L36,29.5 Q36,34 40.5,34 Q36,34 36,38.5 Q36,34 31.5,34 Q36,34 36,29.5 Z" fill="#FFFFFF"/>
  <path d="M78,72 L78,69 Q78,72 81,72 Q78,72 78,75 Q78,72 75,72 Q78,72 78,69 Z" fill="#4CC9F0"/>
</svg>
